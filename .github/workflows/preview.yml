name: preview

on:
  pull_request:
    paths:
      - docs/**
      - sphinx_pyxel/**
      - .github/workflows/preview.yml
      - .github/workflows/pages.yml
      - pyproject.toml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install -e . --system
      - run: python -m sphinx -b html docs docs/_build/html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
          enable_jekyll: false
      - uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${n}/`;
            const body = `📖 Live docs preview: ${url}`;
            const marker = '<!--docs-preview-->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: n,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: n, body: marker + '\n' + body,
              });
            }
