name: preview

on:
  pull_request:
    paths:
      - docs/**
      - sphinx_pyxel/**
      - .github/workflows/preview.yml
      - .github/workflows/pages.yml
      - pyproject.toml

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install -e . --system
      - run: python -m sphinx -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview-${{ github.event.pull_request.number }}
          path: docs/_build/html
          retention-days: 14
      - uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `📖 Docs preview built. Download artifact \`docs-preview-${n}\` from [this run](${url}) and open \`index.html\` locally.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: n,
            });
            const marker = '<!--docs-preview-->';
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: n, body: marker + '\n' + body,
              });
            }
