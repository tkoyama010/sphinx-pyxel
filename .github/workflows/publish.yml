name: Publish to PyPI

# Trigger on the v* tag push instead of the `release: published` event:
# release-please creates the release with GITHUB_TOKEN, and GitHub does not
# let GITHUB_TOKEN-fired events (except push/issue) spawn downstream workflows.
# Tag pushes are exempt, so `push: tags` fires reliably.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
